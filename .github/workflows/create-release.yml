name: Create Release

on:
    workflow_dispatch:
        inputs:
            tag:
                description: 'Tag to create, for example v2.3.74-fork.1'
                required: true
                type: string
            prerelease:
                description: 'Mark the GitHub Release as a pre-release'
                required: false
                type: boolean
                default: false

jobs:
    build:
        uses: ./.github/workflows/build-and-publish.yml
        with:
            runner: 'ubuntu-latest'
            is-release-build: true
            release-version-type: release
            run-build-scan: false
            publish-artifacts: false
        secrets:
            MODRINTH_ID: ''
            MODRINTH_TOKEN: ''
            BUILD_UPDATE_TOKEN: ${{ secrets.BUILD_UPDATE_TOKEN }}
            BUILD_UPDATE_URL: ${{ secrets.BUILD_UPDATE_URL }}

    release:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Download Bukkit artifact
              uses: actions/download-artifact@v6
              with:
                  name: grimac-bukkit
                  path: release-jars

            - name: Download Fabric artifact
              uses: actions/download-artifact@v6
              with:
                  name: grimac-fabric
                  path: release-jars

            - name: Create tag, GitHub Release and attach jars
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ inputs.tag }}
                  PRERELEASE: ${{ inputs.prerelease }}
              run: |
                  if [ "$PRERELEASE" = "true" ]; then
                      PRERELEASE_FLAG="--prerelease"
                  else
                      PRERELEASE_FLAG=""
                  fi
                  gh release create "$TAG" release-jars/*.jar \
                      --target "$GITHUB_SHA" \
                      --title "$TAG" \
                      --generate-notes \
                      $PRERELEASE_FLAG
