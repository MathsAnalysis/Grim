name: Publish Release

on:
    release:
        types: [published]

jobs:
    call-release-workflow:
        uses: ./.github/workflows/build-and-publish.yml
        with:
            runner: 'ubuntu-latest'
            is-release-build: true
            release-version-type: release # Official releases are 'release'
            # Use the body of the GitHub Release as the changelog
            release-changelog: ${{ github.event.release.body }}
            run-build-scan: false
            publish-artifacts: true
        secrets:
            MODRINTH_ID: ${{ secrets.MODRINTH_ID }}
            MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
            BUILD_UPDATE_TOKEN: ${{ secrets.BUILD_UPDATE_TOKEN }}
            BUILD_UPDATE_URL: ${{ secrets.BUILD_UPDATE_URL }}

    attach-jars-to-release:
        needs: call-release-workflow
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Download Bukkit artifact
              uses: actions/download-artifact@v6
              with:
                  name: grimac-bukkit
                  path: release-jars

            - name: Download Fabric artifact
              uses: actions/download-artifact@v6
              with:
                  name: grimac-fabric
                  path: release-jars

            - name: Attach jars to the GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: gh release upload "$RELEASE_TAG" release-jars/*.jar --clobber
